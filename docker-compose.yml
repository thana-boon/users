# SchoolOS "users" module — app only. The database is NOT created here.
#
# This stack attaches to the school's EXISTING PostgreSQL container
# (`postgres-core`, which already hosts the per-module databases) over the
# shared external network `school-net`. We connect as the per-module role
# `users` to the `users` database — nothing else on that server is touched.
#
# Bring up (fully unattended — no prompts, no manual db:push, no seeding step):
#   docker compose up -d --build
#
# Order on `up`: migrate (schema push) -> app. The app creates the first
# teacher-admin itself at startup if none exists (src/instrumentation.ts), so
# there is no bootstrap service in the deploy path to fail the stack.
services:
  # One-shot: creates/updates tables from the Drizzle schema, then exits.
  # `push --force` (the migrator image CMD) skips drizzle-kit's interactive
  # confirmation, so this never blocks waiting for input.
  migrate:
    build:
      context: .
      target: migrator
    container_name: schoolos-users-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:?set DATABASE_URL_INTERNAL in .env}
    # Also fixes up the backup folder's ownership on the way past. Docker creates
    # a missing bind-mount target as root, but the app runs as uid 1001 and could
    # not then write tonight's backup into it. This container runs as root, and
    # `app` already gates on it, so it is the one place that can do this without
    # adding another service to the deploy path (a lesson learned from the
    # bootstrap service that once took the whole stack down).
    # `|| true`: a chown failure must never block the deploy — the app reports an
    # unwritable folder on its backups page instead.
    volumes:
      - ${BACKUP_DIR_HOST:-./backups}:/app/backups
    command:
      - sh
      - -c
      - "chown -R 1001:1001 /app/backups || true; npx drizzle-kit push --force"
    networks:
      - school-net
    # The DB lives outside this stack, so we cannot depends_on its health.
    # Retry a few times instead — covers the server rebooting and bringing up
    # postgres-core and this stack at the same moment.
    restart: on-failure:5


  app:
    build:
      context: .
      args:
        # Prefix the gateway serves this app under (assets + API rewrites —
        # see next.config.mjs). Baked in at BUILD time: after changing it,
        # `docker compose build app`. Defaults to /users to match the deployed
        # gateway; set BASE_PATH= (empty) in .env for a root-mounted app.
        BASE_PATH: ${BASE_PATH:-/users}
    container_name: schoolos-users-app
    restart: unless-stopped
    # Gates on `migrate` only — the schema must exist before the app boots and
    # bootstraps its first admin. There is deliberately no bootstrap SERVICE to
    # gate on: that design let one bad SEED_ADMIN_* value abort the whole stack.
    # The app now does it in-process and a failure there is logged, not fatal.
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:?set DATABASE_URL_INTERNAL in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Secure-by-default: the session cookie gets the Secure flag unless you
      # explicitly opt out. Set COOKIE_SECURE=false in .env ONLY for plain-HTTP
      # LAN access (http://<ip>:3002) — never on an HTTPS/internet-facing deploy.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Origins of the OTHER SchoolOS services allowed to ask "is this user
      # logged in?" at GET /api/auth/session (comma-separated, exact scheme +
      # host + port). Each service runs on its own port, so the call is
      # cross-origin and credentialed. Empty = nobody may ask. See .env.example.
      SSO_ALLOWED_ORIGINS: ${SSO_ALLOWED_ORIGINS:-}
      # Trusted reverse-proxy hops in front of the app (see .env.example). Drives
      # real-client-IP extraction for audit logs and per-IP rate limiting.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-sukhon.ac.th}
      # Read at startup by src/instrumentation.ts: if the DB holds NO active
      # teacher-admin, one is created from these. A no-op once an admin exists,
      # and never fatal — see src/lib/bootstrap.ts.
      SEED_ADMIN_CODE: ${SEED_ADMIN_CODE:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-ผู้ดูแล ระบบ}
      # Session: logged out after SESSION_IDLE_MINUTES of no activity, and in any
      # case SESSION_ABSOLUTE_HOURS after logging in. Activity slides the first
      # one forward; nothing slides the second.
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-15}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-8}
      # Where a signed-out or timed-out browser is sent. Middleware gets this
      # value from the default baked into src/lib/platform.ts, not from here —
      # the edge runtime inlines process.env at build time (same as BASE_PATH).
      PLATFORM_HOME_URL: ${PLATFORM_HOME_URL:-https://schoolos.sukhon.ac.th/}
      # Container clock. Drives the timestamps in backup FILENAMES and in server
      # logs; the nightly run time is pinned separately by BACKUP_TZ so the two
      # cannot disagree about when midnight is.
      TZ: ${TZ:-Asia/Bangkok}
      # Nightly database backup (src/lib/backup-schedule.ts).
      BACKUP_DIR: /app/backups
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-on}
      BACKUP_TIME: ${BACKUP_TIME:-00:00}
      BACKUP_TZ: ${BACKUP_TZ:-Asia/Bangkok}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    networks:
      - school-net
    ports:
      - "3002:3002"
    # Backups live on the HOST, not in the container: they survive
    # `docker compose down`, an image rebuild, and a wiped container, and the
    # school's admin can copy them to a NAS or a USB stick without Docker.
    # Point BACKUP_DIR_HOST at a bigger disk if ./backups is tight — 14 nightly
    # dumps of a database with photos in it is the size to plan for.
    volumes:
      - ${BACKUP_DIR_HOST:-./backups}:/app/backups

  # One-shot bulk seed: loads .example/*.xlsx into the DB (teachers + students).
  # The Excel files are PII and live NEITHER in git NOR the image — they are
  # bind-mounted read-only from the host at run time. Put the two .xlsx files in
  # ./.example/ on the host, then run:
  #   docker compose run --rm seed
  # Guarded by a profile so a plain `docker compose up` never triggers it.
  #
  # NOTE this is the ONLY remaining way to run a one-off script in the deployed
  # stack: it is built from the `migrator` target, so it has tsx + scripts/,
  # which the `app` image (Next.js standalone) does not. Overriding its command
  # is how you reset a FORGOTTEN admin password — the startup bootstrap only
  # ever creates an admin when none exists, and never overwrites one:
  #   docker compose run --rm seed npm run admin:create -- <code> "<newPassword>"
  seed:
    build:
      context: .
      target: migrator
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:?set DATABASE_URL_INTERNAL in .env}
      # Must match the app's key — seed encrypts password/citizen_id on insert.
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-sukhon.ac.th}
    networks:
      - school-net
    volumes:
      - ./.example:/app/.example:ro   # host xlsx -> container, read-only
    command: ["npm", "run", "seed"]
    restart: "no"

# The DB's network, created and owned by the postgres-core stack. `external`
# means compose joins it and never creates or deletes it.
networks:
  school-net:
    external: true
